spring.application.name=order-service
spring.threads.virtual.enabled=true
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_service}
spring.datasource.username=${ORDER_DB_USERNAME:observe}
spring.datasource.password=${ORDER_DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081
inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

resilience4j.timelimiter.instances.inventory.timeout-duration=3s

resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=5s

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=order-service

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n
logging.level.root=INFO
