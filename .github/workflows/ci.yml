name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify reactor
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate Docker Compose configuration
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export SMTP_USERNAME="ci@example.invalid"
          export SMTP_PASSWORD="$(openssl rand -hex 24)"
          export NOTIFICATION_FROM="ci@example.invalid"
          export ALERT_EMAIL_TO="operations@example.invalid"
          docker compose --profile tools config --quiet
          docker compose --profile tools config --format json | python -c 'import json, sys; services = json.load(sys.stdin)["services"]; names = ("inventory-service", "order-service", "ai-incident-analyzer", "notification-service", "api-gateway"); required = ("interval", "timeout", "retries", "start_period"); missing = {name: [key for key in required if key not in services[name]["healthcheck"]] for name in names}; assert not any(missing.values()), f"Missing Java health-check settings: {missing}"'

      - name: Build application container
        run: docker build --build-arg SERVICE=ai-incident-analyzer --tag observe-ai-analyzer:ci .
