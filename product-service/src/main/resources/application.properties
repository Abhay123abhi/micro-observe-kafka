spring.application.name=product-service
spring.data.mongodb.uri=mongodb://localhost:27017/product-service

#URL: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

#URL: http://localhost:8080/api-docs
springdoc.api-docs.path=/api-docs

# Actuator EndPoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,heapdump
management.endpoint.health.show-details=always

# Metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=product-service

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Logging Pattern with Trace IDs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n
logging.level.root=INFO
