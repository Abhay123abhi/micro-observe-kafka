spring.application.name=inventory-service
spring.threads.virtual.enabled=true

spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_service}
spring.datasource.username=${INVENTORY_DB_USERNAME:observe}
spring.datasource.password=${INVENTORY_DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8082

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=inventory-service

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n
logging.level.root=INFO
