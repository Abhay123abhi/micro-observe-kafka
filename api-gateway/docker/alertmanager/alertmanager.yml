global:
  resolve_timeout: 5m

route:
  receiver: incident-platform
  group_by: [alertname, job, service]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: incident-platform
    webhook_configs:
      - url: http://ai-incident-analyzer:8084/api/incidents/webhooks/alertmanager
        send_resolved: true

inhibit_rules:
  - source_matchers: ['alertname = ServiceUnavailable']
    target_matchers: ['severity =~ warning|critical']
    equal: [job]
