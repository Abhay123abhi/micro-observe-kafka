groups:
  - name: workload-incidents
    rules:
      - alert: ServiceUnavailable
        expr: up{job=~"api-gateway|order-service|inventory-service|notification-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for one minute."

      - alert: HighErrorRate
        expr: |
          sum by (job, service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job, service) (rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has a high error rate"
          description: "More than five percent of requests have failed for two minutes."

      - alert: HighResponseLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job, service) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has high response latency"
          description: "P95 response latency has exceeded two seconds for two minutes."

      - alert: DatabaseConnectionPoolSaturation
        expr: |
          sum by (job, service) (hikaricp_connections_active)
          /
          clamp_min(sum by (job, service) (hikaricp_connections_max), 1)
          > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} database pool is saturated"
          description: "More than ninety percent of database connections are active."
