spring.application.name=api-gateway
spring.threads.virtual.enabled=true
server.port=9000
services.order.url=${ORDER_SERVICE_URL:http://localhost:8081}
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
services.incident.url=${INCIDENT_SERVICE_URL:http://localhost:8084}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=Order Service
springdoc.swagger-ui.urls[0].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Inventory Service
springdoc.swagger-ui.urls[1].url=/aggregate/inventory-service/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.event-consumer-buffer-size=10
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

resilience4j.timelimiter.configs.default.timeout-duration=3s

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=api-gateway

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n
logging.level.root=INFO
