name: micro-observe-kafka

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  MANAGEMENT_TRACING_ENABLED: ${TRACING_ENABLED:-false}
  ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
  LOGGING_LOKI_URL: http://loki:3100/loki/api/v1/push

x-java-service: &java-service
  restart: unless-stopped
  init: true
  networks:
    - backend
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 60s

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ops/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  broker:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8181:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8181}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
    volumes:
      - ./api-gateway/docker/keycloak/realms:/opt/keycloak/data/import:ro
    networks:
      - backend

  product-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: product-service
    mem_limit: 384m
    ports:
      - "8080:8080"
    environment:
      <<: *java-environment
      PRODUCT_DB_URL: jdbc:mysql://mysql:3306/product_service
      PRODUCT_DB_USERNAME: root
      PRODUCT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy

  inventory-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: inventory-service
    mem_limit: 384m
    ports:
      - "8082:8082"
    environment:
      <<: *java-environment
      INVENTORY_DB_URL: jdbc:mysql://mysql:3306/inventory_service
      INVENTORY_DB_USERNAME: root
      INVENTORY_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]

  order-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: order-service
    mem_limit: 448m
    ports:
      - "8081:8081"
    environment:
      <<: *java-environment
      ORDER_DB_URL: jdbc:mysql://mysql:3306/order_service
      ORDER_DB_USERNAME: root
      ORDER_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      mysql:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]

  notification-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: notification-service
    mem_limit: 384m
    ports:
      - "8083:8083"
    environment:
      <<: *java-environment
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:?Set NOTIFICATION_FROM in .env}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]

  api-gateway:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: api-gateway
    mem_limit: 448m
    ports:
      - "9000:9000"
    environment:
      <<: *java-environment
      JWT_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8181}/realms/spring-microservices-security-realm
      JWT_JWK_SET_URI: http://keycloak:8080/realms/spring-microservices-security-realm/protocol/openid-connect/certs
      PRODUCT_SERVICE_URL: http://product-service:8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
    depends_on:
      keycloak:
        condition: service_started
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/actuator/health"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - backend

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: ["observability", "ai"]
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./api-gateway/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./api-gateway/docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - backend

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./api-gateway/docker/grafana:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - backend

  ml-anomaly-detector:
    build:
      context: ./ml-anomaly-detector
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    profiles: ["ai"]
    depends_on:
      broker:
        condition: service_healthy
      prometheus:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_OUTPUT_TOPIC: alerts-ml
      ANOMALY_THRESHOLD: "0.6"
      LOG_LEVEL: INFO
    networks:
      - backend

networks:
  backend:

volumes:
  mysql-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
